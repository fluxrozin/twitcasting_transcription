[project]
name = "twitcasting-transcription"
version = "0.1.0"
description = "Transcribe Twitcasting recordings to SRT subtitles"
authors = [
    { name = "fluxrozin", email = "fluxrozin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "faster-whisper>=1.1.0",
    # faster-whisper 1.2.1 passes metadata_errors, which PyAV 19 removed.
    "av>=11,<19",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=4.0",
    "torch",
    "torchaudio",
]

[project.scripts]
twitcasting-transcribe = "twitcasting_transcription.cli:app"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
